spring.application.name=api
server.servlet.context-path=/api
server.forward-headers-strategy=framework
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Migrations (Flyway)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Seguranca e JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Bootstrap do primeiro SuperAdmin em producao (executado apenas se nao houver SUPERADMIN)
app.bootstrap.superadmin.nome=${BOOTSTRAP_SUPERADMIN_NOME:Super Administrador}
app.bootstrap.superadmin.email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
app.bootstrap.superadmin.password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}

# Integracao FIPE
fipe.base-url=${FIPE_BASE_URL:https://fipe.parallelum.com.br/api/v2}
fipe.token=${FIPE_TOKEN:}

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# Health check (ALB / ECS / Docker)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

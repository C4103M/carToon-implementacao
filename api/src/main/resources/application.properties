spring.application.name=api
server.servlet.context-path=/api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Mapeia as variaveis passadas pelo docker-compose.yml
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-ms=3600000
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Configuracoes da integracao FIPE
fipe.base-url=${FIPE_BASE_URL:https://fipe.parallelum.com.br/api/v2}
fipe.token=${FIPE_TOKEN:}

# Configuracoes de Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h
$kind: http-request
description: Lista as ordens de serviço filtradas por oficinaId.
url: "{{baseUrl}}?oficinaId=1&page=0&size=10"
method: GET
queryParams:
  oficinaId: "1"
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Retornou paginação Spring Data', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('content');
          pm.expect(jsonData.content).to.be.an('array');
      });
    language: text/javascript
order: 3000

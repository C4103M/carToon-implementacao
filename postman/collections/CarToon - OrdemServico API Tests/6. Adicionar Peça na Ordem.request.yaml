$kind: http-request
description: Associa um item peça à ordem de serviço.
url: "{{baseUrl}}/{{ordemId}}/itens-peca"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pecaId": 1,
      "quantidade": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000

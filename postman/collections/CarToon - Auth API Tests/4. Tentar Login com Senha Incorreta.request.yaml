$kind: http-request
description: Testa tentativa de login com senha incorreta e valida que o acesso é recusado.
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@teste.com",
      "password": "senhaIncorreta123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code indica credenciais inválidas (401 ou 403)', function () {
          pm.expect(pm.response.code).to.be.oneOf([401, 403]);
      });

      pm.test('Não emite cookie de autenticação JWT válido', function () {
          var setCookie = pm.response.headers.get('Set-Cookie');
          if (setCookie) {
              pm.expect(setCookie).to.not.include('jwt=ey');
          }
      });
    language: text/javascript
order: 4000

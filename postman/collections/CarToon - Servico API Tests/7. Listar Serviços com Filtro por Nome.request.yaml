$kind: http-request
description: Filtra os serviços buscando pelo nome de forma paginada (US08 - CT07).
url: "{{baseUrl}}?nome=Óleo&page=0&size=10"
method: GET
queryParams:
  nome: Óleo
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Itens retornados contêm o nome pesquisado', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.content).to.be.an('array');
          jsonData.content.forEach(function (servico) {
              pm.expect(servico.nome.toLowerCase()).to.include('óleo'.toLowerCase());
          });
      });
    language: text/javascript
order: 7000

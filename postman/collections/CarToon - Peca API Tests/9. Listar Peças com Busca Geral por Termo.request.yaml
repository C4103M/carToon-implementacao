$kind: http-request
description: Filtra as peças pelo termo geral de busca (nome ou fabricante).
url: "{{baseUrl}}?busca=Pastilha&page=0&size=10"
method: GET
queryParams:
  busca: Pastilha
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Retornou resultados da busca geral', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.content).to.be.an('array');
      });
    language: text/javascript
order: 9000

$kind: http-request
description: Atualiza os dados da Peça com o ID salvo na variável {{pecaId}}.
url: "{{baseUrl}}/{{pecaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Pastilha de Freio Dianteira Cerâmica",
      "fabricante": "Fras-le",
      "valorBase": 185.90
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Peça atualizada com sucesso', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.nome).to.eql('Pastilha de Freio Dianteira Cerâmica');
          pm.expect(Number(jsonData.valorBase)).to.eql(185.90);
      });
    language: text/javascript
order: 10000

$kind: http-request
description: Filtra as peças buscando pelo fabricante (US09 - CT07).
url: "{{baseUrl}}?fabricante=Fras-le&page=0&size=10"
method: GET
queryParams:
  fabricante: Fras-le
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 200 OK', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Itens retornados contêm o fabricante pesquisado', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.content).to.be.an('array');
          jsonData.content.forEach(function (peca) {
              pm.expect(peca.fabricante.toLowerCase()).to.include('fras-le');
          });
      });
    language: text/javascript
order: 8000

$kind: http-request
description: Valida rejeição ao enviar peça com valor base menor ou igual a zero (US09 - CT03).
url: "{{baseUrl}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nome": "Filtro de Óleo",
      "fabricante": "Bosch",
      "valorBase": -10.00
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Retornou erro de validação para valor negativo', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('errosValidacao');
      });
    language: text/javascript
order: 3000

$kind: http-request
description: Valida o retorno 404 Not Found ao buscar um ID inexistente de Peça.
url: "{{baseUrl}}/99999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code é 404 Not Found', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
